[project]
name = "em-gmvae-traffic"
version = "0.3.0"
description = "Fixed-EM mixture-prior graph VAE with analytic auxiliary-joint Renyi regularization"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.1", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
